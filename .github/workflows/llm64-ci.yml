name: llm64-ci

on:
  push:
    branches:
      - feat/llm64-syscall-inference
  pull_request:
    paths:
      - 'llm64/**'
      - '.github/workflows/llm64-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm binutils
      - name: Build syscall-only ELF
        run: make -C llm64 clean all check
      - name: Run checkpoint/tokenizer format regressions
        run: make -C llm64 test-formats
      - name: Run runtime regression targets
        run: |
          make -C llm64 test-sha256-runtime
          make -C llm64 test-tokenizer-identity
          make -C llm64 test-tokenizer-runtime
          make -C llm64 test-math-runtime
          make -C llm64 test-attention-runtime
          make -C llm64 test-model-layout
          make -C llm64 test-runtime-memory
          make -C llm64 test-decode-runtime
          make -C llm64 test-generate-cli
      - name: Inspect ELF dependencies
        run: |
          file llm64/niyah-asm
          readelf -h llm64/niyah-asm
          readelf -l llm64/niyah-asm
          if readelf -d llm64/niyah-asm 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'unexpected dynamic dependency'
            exit 1
          fi
