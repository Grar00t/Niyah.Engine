name: release-build

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".release/**"
      - "CMakeLists.txt"
      - "scripts/**"
      - "src/**"
      - "include/**"
      - "tools/**"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".release/v0.1.0"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Release build
        run: bash scripts/verify.sh release

      - name: Build and smoke-test TGZ package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist smoke

          (
            cd build/verify-posix-release
            cpack -G TGZ
          )

          package="$(find build/verify-posix-release -maxdepth 1 -type f -name 'Niyah.Engine-*.tar.gz' -print -quit)"
          test -n "$package"

          artifact="dist/Niyah.Engine-0.1.0-linux-x86_64.tar.gz"
          cp "$package" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"

          tar -xzf "$artifact" -C smoke
          exe="$(find smoke -type f -path '*/bin/niyah' -print -quit)"
          test -n "$exe"
          "$exe" --help

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niyah-release-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Release build
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify.ps1 -Configuration Release -Jobs 2

      - name: Build and smoke-test ZIP package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $PWD 'dist'
          $smoke = Join-Path $PWD 'smoke'
          New-Item -ItemType Directory -Force -Path $dist, $smoke | Out-Null

          Push-Location build/verify-windows-release
          try {
            cpack -C Release -G ZIP
            if ($LASTEXITCODE -ne 0) { throw 'cpack failed' }
            $package = Get-ChildItem -Filter 'Niyah.Engine-*.zip' | Select-Object -First 1
            if (-not $package) { throw 'CPack ZIP was not produced' }
            $packagePath = $package.FullName
          }
          finally {
            Pop-Location
          }

          $artifact = Join-Path $dist 'Niyah.Engine-0.1.0-windows-x86_64.zip'
          Copy-Item $packagePath $artifact

          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($artifact))" |
            Set-Content -Path "$artifact.sha256" -Encoding ascii

          Expand-Archive -Path $artifact -DestinationPath $smoke -Force
          $exe = Get-ChildItem $smoke -Recurse -Filter 'niyah.exe' |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]niyah\.exe$' } |
            Select-Object -First 1
          if (-not $exe) { throw 'extracted niyah.exe not found' }

          & $exe.FullName --help
          if ($LASTEXITCODE -ne 0) { throw 'extracted niyah.exe --help failed' }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niyah-release-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify ASan/UBSan
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash scripts/verify.sh sanitize

  release-bundle:
    needs: [package-linux, package-windows, verify-sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: niyah-release-*
          path: dist
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          test -s dist/SHA256SUMS.txt
          test -f dist/Niyah.Engine-0.1.0-linux-x86_64.tar.gz
          test -f dist/Niyah.Engine-0.1.0-windows-x86_64.zip

      - name: Upload combined release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: niyah-release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify GitHub CLI
        if: github.event_name == 'push'
        run: gh --version

      - name: Create immutable v0.1.0 tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < .release/v0.1.0)"
          test "$tag" = "v0.1.0"

          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "tag $tag already exists at $existing, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "TAG_ALREADY_EXISTS=$tag@$existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
            echo "TAG_CREATED=$tag@$GITHUB_SHA"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag="$(tr -d '\r\n' < .release/v0.1.0)"
          else
            tag="$GITHUB_REF_NAME"
          fi

          test "$tag" = "v0.1.0"
          notes="docs/releases/$tag.md"
          test -f "$notes"

          assets=(
            dist/Niyah.Engine-0.1.0-linux-x86_64.tar.gz
            dist/Niyah.Engine-0.1.0-windows-x86_64.zip
            dist/SHA256SUMS.txt
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "Niyah.Engine $tag" \
              --notes-file "$notes"
          fi

          gh release edit "$tag" --draft=false
          echo "RELEASE_PUBLISHED=$tag@$GITHUB_SHA"
