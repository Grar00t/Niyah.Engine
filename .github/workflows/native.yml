name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: native cmake + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure

  native-sanitize:
    name: native asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        run: cmake -S native -B build/native-sanitize -DNIYAH_SANITIZE=ON
      - name: Build
        run: cmake --build build/native-sanitize --parallel
      - name: Test
        run: ctest --test-dir build/native-sanitize --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  search:
    name: search cmake + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install libcurl development headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure
        run: cmake -S search -B build/search -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/search --parallel
      - name: Test
        run: ctest --test-dir build/search --output-on-failure

  storage:
    name: PostgreSQL storage cmake + ctest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: niyah_ci
          POSTGRES_USER: niyah_ci
          POSTGRES_PASSWORD: niyah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niyah_ci -d niyah_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install PostgreSQL development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client

      - name: Apply canonical migrations
        run: |
          python3 tools/apply_postgres_migrations.py \
            --dbname "host=127.0.0.1 port=5432 dbname=niyah_ci user=niyah_ci password=niyah_ci"

      - name: Configure
        run: cmake -S storage -B build/storage -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/storage --parallel

      - name: Test
        run: ctest --test-dir build/storage --output-on-failure
        env:
          NIYAH_TEST_PG_CONNINFO: host=127.0.0.1 port=5432 dbname=niyah_ci user=niyah_ci password=niyah_ci

  python:
    name: python tooling + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test
        run: sh tools/ci.sh python

  windows-ui:
    name: windows native + WPF UI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure native
        run: cmake -S native -B build/native-windows -A x64
      - name: Build native
        run: cmake --build build/native-windows --config Release --parallel
      - name: Test native
        run: ctest --test-dir build/native-windows -C Release --output-on-failure
      - name: Build WPF UI
        run: dotnet build ui/Niyah.App/Niyah.App.csproj --configuration Release --nologo
