name: native-full-compile

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/NiyahNativeFull.cmake'
      - 'src/**'
      - 'include/**'
      - 'tools/niyah_train.c'
      - 'tools/niyah_probe.c'
      - '.github/workflows/native-full-compile.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure recovered native target
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DNIYAH_BUILD_NATIVE_FULL=ON
      - name: Build recovered native target
        run: cmake --build build-native --config Release --parallel --target niyah-native-full niyah-native-train niyah-native-probe

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure recovered native target
        run: cmake -S . -B build-native -DNIYAH_BUILD_NATIVE_FULL=ON
      - name: Build recovered native target
        run: cmake --build build-native --config Release --parallel --target niyah-native-full niyah-native-train niyah-native-probe
