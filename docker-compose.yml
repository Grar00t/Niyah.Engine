services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: niyah-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niyah}
      POSTGRES_USER: ${POSTGRES_USER:-niyah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

    volumes:
      - niyah_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-niyah} -d ${POSTGRES_DB:-niyah}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - niyah_local

  migrate:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-niyah}
      PGUSER: ${POSTGRES_USER:-niyah}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      NIYAH_MIGRATION_DIR: /migrations

    volumes:
      - ./db/migrations:/migrations:ro
      - ./tools/apply_postgres_migrations.sh:/runner/apply_postgres_migrations.sh:ro

    entrypoint:
      - /bin/sh
      - /runner/apply_postgres_migrations.sh

    networks:
      - niyah_local

volumes:
  niyah_pgdata:

networks:
  niyah_local:
    driver: bridge
    internal: true
