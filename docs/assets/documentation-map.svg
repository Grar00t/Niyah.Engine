<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Niyah.Engine documentation map</title>
  <desc id="desc">Documentation is organized from quickstart and architecture through training, data, evaluation, model card, and verification.</desc>
  <rect width="1200" height="520" rx="24" fill="#0b1020"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="60" y="58" fill="#f8fafc" font-size="28" font-weight="700">Documentation map</text>
    <text x="60" y="87" fill="#94a3b8" font-size="15">Usage, implementation, experiment evidence, and claim boundaries are separated.</text>

    <g stroke="#475569" stroke-width="2" fill="none">
      <path d="M230 174 H350"/>
      <path d="M500 174 H620"/>
      <path d="M770 174 H890"/>
      <path d="M695 212 V305"/>
      <path d="M965 212 V305"/>
      <path d="M425 212 V305"/>
    </g>

    <g font-size="17" font-weight="700" text-anchor="middle">
      <g><rect x="70" y="135" width="160" height="78" rx="14" fill="#172033" stroke="#38bdf8"/><text x="150" y="168" fill="#e2e8f0">Quickstart</text><text x="150" y="192" fill="#94a3b8" font-size="12" font-weight="500">run the lifecycle</text></g>
      <g><rect x="350" y="135" width="150" height="78" rx="14" fill="#172033" stroke="#60a5fa"/><text x="425" y="168" fill="#e2e8f0">Architecture</text><text x="425" y="192" fill="#94a3b8" font-size="12" font-weight="500">what exists</text></g>
      <g><rect x="620" y="135" width="150" height="78" rx="14" fill="#172033" stroke="#818cf8"/><text x="695" y="168" fill="#e2e8f0">Training</text><text x="695" y="192" fill="#94a3b8" font-size="12" font-weight="500">how it learns</text></g>
      <g><rect x="890" y="135" width="150" height="78" rx="14" fill="#172033" stroke="#a78bfa"/><text x="965" y="168" fill="#e2e8f0">Evaluation</text><text x="965" y="192" fill="#94a3b8" font-size="12" font-weight="500">what metrics show</text></g>

      <g><rect x="335" y="305" width="180" height="78" rx="14" fill="#111a2f" stroke="#64748b"/><text x="425" y="338" fill="#e2e8f0">CLI Reference</text><text x="425" y="362" fill="#94a3b8" font-size="12" font-weight="500">source-backed commands</text></g>
      <g><rect x="605" y="305" width="180" height="78" rx="14" fill="#111a2f" stroke="#64748b"/><text x="695" y="338" fill="#e2e8f0">Data</text><text x="695" y="362" fill="#94a3b8" font-size="12" font-weight="500">provenance &amp; quality</text></g>
      <g><rect x="875" y="305" width="180" height="78" rx="14" fill="#111a2f" stroke="#64748b"/><text x="965" y="338" fill="#e2e8f0">Model Card</text><text x="965" y="362" fill="#94a3b8" font-size="12" font-weight="500">capability boundary</text></g>
    </g>

    <rect x="330" y="430" width="540" height="54" rx="27" fill="#1a1735" stroke="#8b5cf6"/>
    <text x="600" y="464" fill="#e9d5ff" font-size="18" font-weight="700" text-anchor="middle">Verification — repository evidence + local experiment evidence ledger</text>
  </g>
</svg>
